[project]
name = "app-context-mcp"
version = "0.1.0"
description = "One-tool MCP context/evidence server for Flutter codebases"
requires-python = ">=3.10"
dependencies = [
  "mcp>=1.0.0",
  "semble>=0.1.0",
  "numpy>=1.24",
  "scikit-learn>=1.3",
  "rank-bm25>=0.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
app-context-mcp = "app_context_mcp.server:main"
app-context-index = "app_context_mcp.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
